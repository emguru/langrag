services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ingestion:
    build: ./ingestion
    ports:
      - "8001:8001"
    environment:
      QDRANT_URL: http://qdrant:6333
      S3_DOCUMENT_BUCKET: local-documents
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      LLM_PROVIDER: openai
      RAG_HYBRID: "true"
      RAG_RERANK: "false"
    env_file:
      - .env
    depends_on:
      - qdrant

  agents:
    build: ./agents
    ports:
      - "8123:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      INGESTION_API_URL: http://ingestion:8001
    env_file:
      - .env
    depends_on:
      - qdrant
      - ingestion

  ui-api:
    build: ./ui
    ports:
      - "8000:8000"
    environment:
      LANGGRAPH_URL: http://agents:8000
      INGESTION_URL: http://ingestion:8001
      RAG_ASSISTANT_ID: rag_agent
    env_file:
      - .env
    depends_on:
      - agents
      - ingestion

  ui-dev:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - ./ui:/app
    depends_on:
      - ui-api

volumes:
  qdrant_data:
