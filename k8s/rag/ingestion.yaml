apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: rag
  labels:
    app: ingestion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ingestion
      containers:
        - name: ingestion
          image: INGESTION_IMAGE
          ports:
            - containerPort: 8001
          envFrom:
            - secretRef:
                name: app-secrets
            - configMapRef:
                name: app-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion
  namespace: rag
spec:
  selector:
    app: ingestion
  ports:
    - port: 8001
      targetPort: 8001
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingestion
  namespace: rag
  annotations:
    eks.amazonaws.com/role-arn: INGESTION_IRSA_ROLE_ARN
