apiVersion: v1
kind: Service
metadata:
  name: showcase-ui
  namespace: showcase
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  selector:
    app: showcase-ui
  ports:
    - port: 80
      targetPort: 8000
