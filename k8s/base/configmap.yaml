apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: agents
data:
  LANGSMITH_PROJECT: "research-showcase"
  LANGSMITH_TRACING: "true"
  QDRANT_URL: "http://qdrant.rag.svc.cluster.local:6333"
  QDRANT_COLLECTION: "research_docs"
  INGESTION_API_URL: "http://ingestion.rag.svc.cluster.local:8001"
  BEDROCK_REGION: "us-east-1"
  BEDROCK_READ_TIMEOUT: "600"
  DEFAULT_LLM_MODEL: "us.anthropic.claude-sonnet-4-6"
  DEFAULT_EMBEDDING_MODEL: "amazon.titan-embed-text-v2:0"
  LLM_PROVIDER: "bedrock"
  MAX_RESEARCHER_PARALLEL: "2"
  RAG_TOP_K: "8"
  RAG_MIN_VECTOR_SCORE: "0.12"
  RAG_EXPAND_SAME_DOCUMENT: "true"
  RAG_SAME_DOCUMENT_MAX_PER_DOC: "12"
  CRAG_ENABLED: "true"
  SWAG_ENABLED: "true"
  RAG_AUGMENTATION_MODE: "swag_crag"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: rag
data:
  QDRANT_URL: "http://qdrant.rag.svc.cluster.local:6333"
  QDRANT_COLLECTION: "research_docs"
  BEDROCK_REGION: "us-east-1"
  DEFAULT_EMBEDDING_MODEL: "amazon.titan-embed-text-v2:0"
  LLM_PROVIDER: "bedrock"
  CHUNK_SIZE: "1000"
  CHUNK_OVERLAP: "200"
  MAX_UPLOAD_BYTES: "104857600"
  MAX_FETCH_BYTES: "104857600"
  RATE_LIMIT_INGEST_PER_MIN: "30"
  RATE_LIMIT_SEARCH_PER_MIN: "30"
  RAG_TOP_K: "8"
  RAG_MIN_VECTOR_SCORE: "0.12"
  RAG_EXPAND_SAME_DOCUMENT: "true"
  RAG_SAME_DOCUMENT_MAX_PER_DOC: "12"
  CRAG_ENABLED: "true"
  CRAG_GRADER_MODEL: "us.anthropic.claude-3-haiku-20240307-v1:0"
  SWAG_ENABLED: "true"
  SWAG_INGEST_PROFILES: "true"
  # heuristic = rule-based SWAG profiles (no Bedrock); llm = Sonnet/Haiku grader
  SWAG_PROFILE_MODE: "heuristic"
  SWAG_GRADER_MODEL: "us.anthropic.claude-sonnet-4-6"
  SWAG_MIN_SCORE_THRESHOLD: "0.08"
  SWAG_MAX_CHUNKS_PER_SOURCE: "3"
  SWAG_DEDUPLICATE_SIMILARITY: "0.92"
  SWAG_ADAPTIVE_BLEND: "true"
  SWAG_NOISE_RELATIVE_VECTOR_RATIO: "0.65"
  SWAG_NOISE_BACKFILL_RATIO: "0.58"
  SWAG_EVALUATIVE_BLEND_BOOST: "0.15"
  SWAG_CHUNK_TITLE_MULTIPLIER: "0.40"
  SWAG_CHUNK_BOILERPLATE_MULTIPLIER: "0.02"
  SWAG_INTENT_CATEGORY_BOOST: "1.25"
  SWAG_RETRIEVAL_CANDIDATES: "20"
  SWAG_VECTOR_WEIGHT: "0.65"
  SWAG_WEIGHT: "0.30"
  SWAG_METADATA_WEIGHT: "0.05"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: showcase
data:
  LANGSMITH_PROJECT: "research-showcase"
  CORS_ORIGINS: "https://langrag.automatico.llc"
  MAX_UPLOAD_BYTES: "104857600"
  RATE_LIMIT_INGEST_PER_MIN: "10"
  RATE_LIMIT_RESEARCH_PER_MIN: "2"
  RATE_LIMIT_RAG_SEARCH_PER_MIN: "30"
  DEFAULT_COLLECTION: "research_docs"
  ALLOWED_COLLECTIONS: "research_docs"
